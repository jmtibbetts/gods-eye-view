  <div id="cesiumContainer"></div>
  <div id="world-overlay-root" aria-hidden="true">
    <canvas id="world-overlay-canvas"></canvas>
  </div>
  <div id="world-overlay-actions" class="world-overlay-accessibility" role="region" aria-label="Visible map targets">
    <div id="world-overlay-action-list"></div>
    <div id="world-overlay-status" role="status" aria-live="polite" aria-atomic="true"></div>
  </div>

  <!-- Title -->
  <div id="title-bar">
    <div class="title-glow"></div>
    <h1><span class="title-logo brand-logo" data-logo-gaze data-logo-src="/logo.svg" aria-hidden="true"><img src="/logo.svg" alt="" /></span> <span>GOD'S EYE <span class="title-accent">VIEW</span></span></h1>
    <p class="subtitle">NO PLACE LEFT BEHIND</p>
  </div>

  <!-- Style indicator -->
  <div id="style-indicator">
    <span class="indicator-label">ACTIVE STYLE</span>
    <span class="indicator-value" id="active-style-name">NORMAL</span>
  </div>

  <!-- Top-center camera and share actions -->
  <nav id="top-center-actions" aria-label="Globe actions">
    <button id="clear-selected-layers" type="button" aria-label="Clear selected data layers" title="Turn off all selected data layers">
      <span class="material-symbols-outlined" aria-hidden="true">layers_clear</span>
    </button>
    <button id="snapshot-btn" type="button" aria-label="Save a snapshot of this view" title="Save a PNG snapshot of this view">
      <span class="material-symbols-outlined" aria-hidden="true">photo_camera</span>
    </button>
    <button id="share-btn" type="button" aria-label="Copy share link" title="Copy share link">
      <span class="share-icon" aria-hidden="true">&#x1F517;</span>
    </button>
    <button id="tilt-map-view" type="button" aria-label="Tilt map to oblique view" aria-pressed="false" title="Toggle straight-down and tilted map views">
      <span class="material-symbols-outlined" aria-hidden="true">view_in_ar</span>
    </button>
    <button id="north-up-view" type="button" aria-label="Reset map to north up" title="Reset map bearing to north">
      <span class="camera-compass-n" aria-hidden="true">N</span>
      <span class="camera-compass-needle material-symbols-outlined" aria-hidden="true">navigation</span>
    </button>
    <button id="reset-globe-view" type="button" aria-label="Reset to full globe view" title="Reset camera and return to full globe view">
      <span class="material-symbols-outlined" aria-hidden="true">public</span>
    </button>
  </nav>
  <div id="global-loading-status" role="status" aria-live="polite" aria-atomic="true" hidden>
    <span id="global-loading-label">LOADING LIVE DATA</span>
    <span id="global-loading-detail"></span>
  </div>
  <div id="traffic-sync-chip" aria-live="polite">
    <span id="traffic-sync-label">syncing road network</span>
    <span id="traffic-sync-progress">0%</span>
  </div>
  <div id="cctv-sync-chip" aria-live="polite">
    <span id="cctv-sync-label">loading frames</span>
    <span id="cctv-sync-progress">0/0</span>
  </div>

  <!-- In-map receiver dock: web SDR waterfall / LiveATC page without leaving the globe -->
  <section id="audio-dock" class="audio-dock" role="region" aria-label="Receiver window" hidden>
    <div id="audio-dock-bar" class="audio-dock-bar">
      <span id="audio-dock-kind" class="audio-dock-kind">SDR</span>
      <strong id="audio-dock-title" class="audio-dock-title"></strong>
      <span id="audio-dock-subtitle" class="audio-dock-subtitle"></span>
      <span class="panel-divider"></span>
      <button id="audio-dock-zoom-btn" class="audio-dock-zoom" type="button" title="Page zoom: smaller shows more of the receiver" aria-label="Cycle the receiver page zoom" aria-pressed="false">100%</button>
      <button id="audio-dock-reload-btn" type="button" title="Reload the receiver" aria-label="Reload the receiver"><span class="material-symbols-outlined" aria-hidden="true">refresh</span></button>
      <button id="audio-dock-size-btn" type="button" title="Larger" aria-label="Cycle the window size: normal, large, fit the screen" aria-pressed="false"><span class="material-symbols-outlined" aria-hidden="true">open_in_full</span></button>
      <button id="audio-dock-popout-btn" type="button" title="Open in its own tab" aria-label="Open the receiver in its own tab"><span class="material-symbols-outlined" aria-hidden="true">open_in_new</span></button>
      <button id="audio-dock-close-btn" type="button" title="Close" aria-label="Close the receiver window"><span class="material-symbols-outlined" aria-hidden="true">close</span></button>
    </div>
    <div class="audio-dock-body">
      <iframe id="audio-dock-frame" class="audio-dock-frame" title="Receiver" src="about:blank" allow="autoplay" referrerpolicy="no-referrer" loading="eager"></iframe>
      <div id="audio-dock-note" class="audio-dock-note" role="status" aria-live="polite" hidden></div>
      <div id="audio-dock-external" class="audio-dock-external" hidden>
        <strong id="audio-dock-external-title"></strong>
        <p id="audio-dock-external-text"></p>
        <button id="audio-dock-external-btn" type="button">OPEN IT AGAIN ↗</button>
      </div>
    </div>
  </section>

  <!-- Toast notification -->
  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- Safe frame guides for recording composition -->
  <div id="safe-frame-overlay">
    <div id="safe-frame-box"></div>
  </div>
